<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calm Landing ✈️</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b8d8f8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calm Landing">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #7ec8f0;
      --sky-mid: #b8dff8;
      --sky-bot: #dff0ff;
      --green: #66bb6a;
      --green-light: #a5d6a7;
      --gold: #ffd54f;
      --gold-dark: #ffb300;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Nunito', system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      background: linear-gradient(175deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
    }

    /* ─── LEBENDIGER HIMMEL ─── */
    #skyCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Sonne */
    #sun {
      position: fixed;
      top: 8vh;
      right: 12vw;
      width: clamp(60px, 14vw, 100px);
      height: clamp(60px, 14vw, 100px);
      background: radial-gradient(circle, #fff8c0 0%, #ffe066 40%, rgba(255,220,80,0) 75%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: sunPulse 5s ease-in-out infinite;
      filter: blur(1px);
    }
    @keyframes sunPulse {
      0%,100% { transform: scale(1);   opacity: 0.85; }
      50%      { transform: scale(1.1); opacity: 1;    }
    }

    /* Lichtstrahlen */
    #sunRays {
      position: fixed;
      top: 0; right: 0;
      width: 55vw; height: 60vh;
      background: conic-gradient(
        from 200deg at 75% 18%,
        rgba(255,248,180,0.13) 0deg,
        transparent 12deg,
        rgba(255,248,180,0.09) 20deg,
        transparent 32deg,
        rgba(255,248,180,0.11) 44deg,
        transparent 56deg,
        rgba(255,248,180,0.07) 64deg,
        transparent 80deg
      );
      z-index: 1;
      pointer-events: none;
      animation: rayRotate 30s linear infinite;
    }
    @keyframes rayRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(8deg); }
    }

    /* Hintergrund-Wolken (dekorativ, kein Hindernis) */
    .bg-cloud {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      filter: blur(18px);
      z-index: 1;
      pointer-events: none;
      animation: bgCloudDrift linear infinite;
    }
    @keyframes bgCloudDrift {
      from { transform: translateX(110vw); }
      to   { transform: translateX(-60vw); }
    }

    /* Horizont-Dunst */
    #horizon {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      height: 18vh;
      background: linear-gradient(to top, rgba(200,230,255,0.45), transparent);
      z-index: 1;
      pointer-events: none;
    }

    /* ─── OVERLAYS ─── */
    #countdownOverlay, #milestoneOverlay {
      position: fixed;
      inset: 0;
      background: rgba(20,50,80,0.62);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s;
    }
    .visible { opacity: 1 !important; pointer-events: auto !important; }

    #departureText {
      font-size: clamp(1.4rem, 5vw, 2rem);
      color: #cde8ff;
      font-weight: 700;
      margin-bottom: 1.2vh;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #countdownText {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px rgba(100,180,255,0.6);
      line-height: 1;
    }
    #milestoneText {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.45;
      padding: 0 8vw;
      color: #e8f5e9;
      text-shadow: 0 4px 20px #0009;
    }

    /* ─── SPRUCH POPUP (kurze süsse Nachrichten) ─── */
    #spruchBubble {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 2.4rem 2.8rem;
      text-align: center;
      z-index: 800;
      max-width: min(88vw, 440px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s, transform 0.35s;
    }
    #spruchBubble.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    #spruchEmoji { font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; margin-bottom: 0.6rem; }
    #spruchText {
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      font-weight: 700;
      color: #2a4a6a;
      line-height: 1.4;
      margin-bottom: 1.2rem;
    }
    #spruchClose {
      padding: 0.7em 2.2em;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 800;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      transition: transform 0.15s;
    }
    #spruchClose:active { transform: scale(0.94); }

    #spruchCountdown {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      color: #4a7fa5;
      min-height: 2.5rem;
      margin-top: 0.2rem;
      letter-spacing: 0.05em;
      transition: transform 0.2s;
    }

    /* ─── START SCREEN ─── */
    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,35,65,0.45);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    #startScreen h1 {
      font-size: clamp(3.2rem, 12vw, 5.5rem);
      font-weight: 900;
      margin: 0 0 2vh;
      color: #fff;
      text-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    #startScreen p {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 700;
      color: #d6eeff;
      margin: 0 0 6vh;
      line-height: 1.55;
      text-align: center;
      padding: 0 6vw;
    }
    .btn-main {
      padding: 1em 3.5em;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.3rem, 5.5vw, 1.8rem);
      font-weight: 800;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111;
      cursor: pointer;
      box-shadow: 0 12px 38px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }
    .btn-main:active { transform: scale(0.95); }

    /* ─── GAME CONTAINER ─── */
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100vh;
      display: none;
      z-index: 2;
    }

    /* ─── SCORE ─── */
    #score {
      position: absolute;
      top: 2vh;
      left: 4vw;
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      font-weight: 900;
      z-index: 30;
      color: #fff;
      text-shadow: 0 4px 14px #0008;
    }

    /* ─── ROUTE BAR ─── */
    #routeContainer {
      position: absolute;
      top: 1.5vh;
      right: 3vw;
      width: min(88vw, 560px);
      z-index: 40;
    }
    #routeHeader {
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      font-weight: 800;
      margin-bottom: 0.6vh;
      color: #e8f5e9;
      text-shadow: 0 3px 10px #0006;
    }
    #routeBar {
      height: 34px;
      background: rgba(255,255,255,0.22);
      border-radius: 17px;
      overflow: visible;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
      position: relative;
    }
    #routeProgress {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--green-light));
      border-radius: 17px;
      transition: width 1s ease-out;
      box-shadow: 0 0 18px rgba(102,187,106,0.55);
    }
    .stop {
      position: absolute;
      top: -4.5vh;
      font-size: clamp(1rem, 3.8vw, 1.5rem);
      font-weight: 800;
      color: #f1f8e9;
      text-shadow: 0 3px 10px #0007;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ─── PLANE ─── */
    #plane {
      position: absolute;
      left: 14%;
      font-size: clamp(64px, 16vw, 88px);
      line-height: 1;
      z-index: 20;
      transition: transform 0.18s ease-out;
      will-change: top, transform;
    }

    /* ─── CLOUDS (obstacles) ─── */
    .cloud-pair {
      position: absolute;
      width: 160px;
      height: 100vh;   /* ← fix: pair muss volle Höhe haben damit bottom:0 stimmt */
    }
    .cloud {
      position: absolute;
      width: 130px;
      background: rgba(255,255,255,0.96);
      border-radius: 90px;
      left: 15px;
      box-shadow: 0 10px 32px rgba(255,255,255,0.35);
    }
    .cloud.top    { top: 0; }
    .cloud.bottom { bottom: 0; }   /* ← jetzt wirklich am Boden */
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.96);
      border-radius: 50%;
    }
    .cloud::before { width: 60px; height: 60px; left: 18px; top: -26px; }
    .cloud::after  { width: 78px; height: 78px; left: 56px; top: -36px; }

    /* ─── BUILDINGS (obstacles) ─── */
    .building-wrap {
      position: absolute;
      bottom: 0;
      width: 220px;
      height: 100vh;
      pointer-events: none;
    }
    .building {
      position: absolute;
      bottom: 0;
      background: linear-gradient(180deg, #4a6fa5 0%, #2c4a7c 100%);
      border-radius: 4px 4px 0 0;
      box-shadow: inset -6px 0 18px rgba(0,0,0,0.25), 0 0 30px rgba(44,74,124,0.4);
    }
    /* windows: via JS generiert (addWindows) */
    /* antenna on tallest building */
    .building.has-antenna::before {
      content: '';
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 28px;
      background: #2c4a7c;
      border-radius: 2px;
    }

    /* ─── NACHT-MODUS ─── */
    body.night {
      background: linear-gradient(175deg, #0a0e2a 0%, #111b3a 50%, #1a2a50 100%) !important;
      transition: background 8s ease;
    }
    body.night #sun       { opacity: 0; transition: opacity 4s ease; }
    body.night #sunRays   { opacity: 0; transition: opacity 4s ease; }
    body.night #horizon   { background: linear-gradient(to top, rgba(30,60,120,0.5), transparent); }

    /* Mond */
    #moon {
      position: fixed;
      top: 8vh;
      right: 12vw;
      width: clamp(50px, 12vw, 80px);
      height: clamp(50px, 12vw, 80px);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #fffde0, #f0d060);
      box-shadow: 0 0 40px rgba(255,240,120,0.5), 0 0 80px rgba(255,220,80,0.2);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 5s ease;
    }
    body.night #moon { opacity: 1; }

    /* Sterne */
    #starField {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 6s ease;
    }
    body.night #starField { opacity: 1; }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: starTwinkle ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.4); }
    }

    /* Nachtwolken etwas dunkler */
    body.night .bg-cloud {
      background: rgba(80,100,160,0.3);
    }
    /* Gebäude nachts stärker leuchten */
    body.night .building {
      background: linear-gradient(180deg, #1a2a4a 0%, #0d1a33 100%);
      box-shadow: inset -4px 0 12px rgba(0,0,0,0.5), 0 0 40px rgba(30,80,180,0.35);
    }
    /* ─── ROUTE PLANE ─── */
    #routePlane {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      z-index: 10;
      transition: left 1s ease-out;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
      pointer-events: none;
    }

    /* ─── HERZ PARTIKEL ─── */
    .heart-particle {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      z-index: 500;
      animation: heartFloat 0.9s ease-out forwards;
      user-select: none;
    }
    @keyframes heartFloat {
      0%   { opacity: 1;   transform: translateY(0)    scale(1);   }
      100% { opacity: 0;   transform: translateY(-70px) scale(0.5); }
    }
    .mountain-layer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 300%;   /* breit genug zum scrollen */
      pointer-events: none;
      z-index: 1;
    }
    #mountains-far  { bottom: 0; opacity: 0.35; }
    #mountains-mid  { bottom: 0; opacity: 0.55; }
    #mountains-near { bottom: 0; opacity: 0.75; }

    body.night .mountain-layer svg path {
      transition: fill 6s ease;
    }

    /* ─── FINALER ICN ENDSCREEN ─── */
    #finalScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #0a0e2a 0%, #1a1040 50%, #0d1a33 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      overflow: hidden;
    }
    #finalScreen.show { display: flex; }

    .confetti-piece {
      position: absolute;
      width: 10px; height: 14px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      pointer-events: none;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-40px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    #finalContent {
      position: relative; z-index: 2;
      text-align: center; padding: 2rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.4vh;
    }
    #finalTitle {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 900; color: #fff;
      text-shadow: 0 0 30px rgba(255,220,80,0.8);
      line-height: 1.2;
    }
    #finalSub {
      font-size: clamp(1rem, 3.8vw, 1.4rem);
      font-weight: 700; color: #c8e0ff;
      line-height: 1.5; max-width: 80vw;
    }
    #qrBox {
      background: #fff; border-radius: 22px;
      padding: 1.4rem;
      box-shadow: 0 0 60px rgba(255,220,80,0.35), 0 20px 50px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
      align-items: center; gap: 0.6rem;
      margin: 0.5vh 0;
    }
    #qrImg {
      width: clamp(150px, 40vw, 210px);
      height: clamp(150px, 40vw, 210px);
      border-radius: 8px; display: block;
    }
    #qrLabel {
      font-size: clamp(0.9rem, 3.2vw, 1.1rem);
      font-weight: 800; color: #2a4a6a; text-align: center;
    }
    #finalBtn {
      padding: 0.9em 2.8em;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 900; border: none; border-radius: 999px;
      background: linear-gradient(135deg, #ffd54f, #ffb300);
      color: #111; cursor: pointer;
      box-shadow: 0 8px 28px rgba(255,180,0,0.45);
      transition: transform 0.15s;
    }
    #finalBtn:active { transform: scale(0.95); }

    #gameOver {
      position: fixed;
      inset: 0;
      background: rgba(10,30,55,0.55);
      backdrop-filter: blur(14px);
      display: none;
      place-items: center;
      z-index: 100;
    }
    .go-box {
      background: #fff;
      color: #222;
      padding: 3.5rem 2.8rem;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,0.38);
      max-width: 90vw;
    }
    .go-box h2 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 3rem); font-weight: 900; }
    .go-box p  { font-size: clamp(1.2rem, 4.5vw, 1.6rem); margin: 0 0 2.4rem; color: #556; line-height: 1.5; font-weight: 600; }

    /* ─── WIN SCREEN ─── */
    #winScreen {
      position: fixed;
      inset: 0;
      background: rgba(10,50,30,0.7);
      backdrop-filter: blur(14px);
      display: none;
      place-items: center;
      z-index: 100;
    }
    .win-box {
      background: linear-gradient(160deg, #e8f5e9, #fff8e1);
      color: #1a3a1a;
      padding: 3.5rem 2.8rem;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,0.4);
      max-width: 90vw;
    }
    .win-box h2 { margin: 0 0 0.8rem; font-size: clamp(2rem, 8vw, 3rem); font-weight: 900; }
    .win-box p  { font-size: clamp(1.2rem, 4.5vw, 1.6rem); margin: 0 0 2.4rem; color: #2a5a2a; line-height: 1.5; font-weight: 600; }

    /* ─── DECORATIVE BIRDS ─── */
    .bird {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      will-change: left;
    }
  </style>
</head>
<body>

<!-- Lebendiger Himmel -->
<div id="sun"></div>
<div id="sunRays"></div>
<div id="horizon"></div>
<div id="moon"></div>
<div id="starField"></div>

<!-- Parallax Berge -->
<svg id="mountains-far" class="mountain-layer" viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path id="mf-path" d="M0,180 L0,120 Q80,60 160,100 Q240,140 320,80 Q400,20 480,70 Q560,120 640,60 Q720,10 800,65 Q880,120 960,75 Q1040,30 1120,80 Q1200,130 1280,85 Q1360,40 1440,90 L1440,180 Z" fill="#a8c8e8"/>
</svg>
<svg id="mountains-mid" class="mountain-layer" viewBox="0 0 1440 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path id="mm-path" d="M0,140 L0,100 Q60,50 140,85 Q220,120 300,65 Q380,10 460,55 Q540,100 620,50 Q700,5 780,45 Q860,90 940,55 Q1020,20 1100,60 Q1180,100 1260,65 Q1340,30 1440,75 L1440,140 Z" fill="#90b4d0"/>
</svg>
<svg id="mountains-near" class="mountain-layer" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path id="mn-path" d="M0,100 L0,70 Q50,30 120,60 Q190,90 260,45 Q330,5 410,40 Q490,75 560,35 Q630,0 710,35 Q790,70 860,40 Q930,10 1010,45 Q1090,80 1160,50 Q1230,20 1310,55 Q1380,80 1440,60 L1440,100 Z" fill="#7a9eb8"/>
</svg>

<!-- Countdown -->
<div id="countdownOverlay">
  <div id="departureText">Ready for departure ✈️</div>
  <div id="countdownText">3</div>
</div>

<!-- Milestone (Singapur) -->
<div id="milestoneOverlay">
  <div id="milestoneText"></div>
</div>

<!-- Spruch Bubble -->
<div id="spruchBubble">
  <div id="spruchEmoji">🌟</div>
  <div id="spruchText">Super!</div>
  <button id="spruchClose" onclick="closeSpruch()">Weiter ✈️</button>
  <div id="spruchCountdown"></div>
</div>

<!-- Start Screen -->
<div id="startScreen">
  <h1>Calm Landing ✈️</h1>
  <p></p>
  <button class="btn-main" onclick="startGame()"></button>
</div>

<!-- Game -->
<div id="gameContainer">
  <div id="score">0</div>

  <div id="routeContainer">
    <div id="routeHeader">✈️ ZRH → ICN</div>
    <div id="routeBar">
      <div id="routeProgress"></div>
      <div id="routePlane">✈</div>
      <div class="stop" style="left:0%">ZRH</div>
      <div class="stop" style="left:50%">SIN</div>
      <div class="stop" style="left:100%">ICN</div>
    </div>
  </div>

  <div id="plane">✈️</div>
</div>

<!-- Game Over -->
<div id="gameOver">
  <div class="go-box">
    <h2 id="goTitle">Ooops… 😬</h2>
    <p id="goText">Bruchlandung.</p>
    <button class="btn-main" onclick="restartGame()">Nomol versuche ✈️</button>
  </div>
</div>

<!-- Win Screen (Singapur) -->
<div id="winScreen">
  <div class="win-box">

  </div>
</div>

<script>
  // ─────────────────────────────────────────────
  //  DOM refs
  // ─────────────────────────────────────────────
  const plane          = document.getElementById('plane');
  const scoreEl        = document.getElementById('score');
  const gameContainer  = document.getElementById('gameContainer');
  const startScreen    = document.getElementById('startScreen');
  const gameOverEl     = document.getElementById('gameOver');
  const winScreenEl    = document.getElementById('winScreen');
  const finalScreenEl  = document.getElementById('finalScreen');
  const routeProgress  = document.getElementById('routeProgress');
  const milestoneOverlay = document.getElementById('milestoneOverlay');
  const spruchBubble   = document.getElementById('spruchBubble');
  const spruchEmoji    = document.getElementById('spruchEmoji');
  const spruchText     = document.getElementById('spruchText');

  // ─────────────────────────────────────────────
  //  Game state
  // ─────────────────────────────────────────────
  let gameRunning   = false;
  let animationId   = null;
  let scoreTimer    = null;
  let cloudTimer    = null;
  let score         = 0;
  let position      = 48;  // % from top
  let velocity      = 0;
  const GRAVITY     = 0.09;   // noch sanfter
  const LIFT        = -2.3;
  const MAX_VEL     = 4.2;
  let obstacles     = [];
  let firstStart    = true;
  let touchHeld     = false;
  let singaporeShown = false;
  let winReached    = false;
  let invincible    = false;  // true ab Score 50 – kein Crash möglich

  // Meilenstein-Sprüche
  const SPRUECHE = {
    10: { emoji: '😄', text: '' },
    20: { emoji: '💪', text: '' },
    30: { emoji: '🌏', text: '' },
    40: { emoji: '🇸🇬', text: '' },
  };

  // Freche Game-Over-Texte
  const GAME_OVER_MSGS = [
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
    { title: '', text: '' },
  ];

  let triggered = { 10: false, 20: false, 30: false, 40: false, 50: false, 100: false };

  // ─────────────────────────────────────────────
  //  Reset
  // ─────────────────────────────────────────────
  function resetGame() {
    gameRunning = false;
    score = 0;
    position = 48;
    velocity = 0;
    singaporeShown = false;
    winReached = false;
    invincible = false;
    triggered = { 10: false, 20: false, 30: false, 40: false, 50: false, 100: false };

    scoreEl.textContent = '0';
    scoreEl.title = '';
    plane.style.top = '48%';
    plane.style.transform = 'rotate(0deg)';
    plane.style.filter = '';
    routeProgress.style.width = '0%';
    updateCityLabel(0);

    gameOverEl.style.display = 'none';
    winScreenEl.style.display = 'none';
    finalScreenEl.classList.remove('show');
    milestoneOverlay.classList.remove('visible');
    spruchBubble.classList.remove('show');
    deactivateNightMode();

    obstacles.forEach(o => o?.el?.remove());
    obstacles = [];

    // ── Bugs fix: Vögel aufräumen ──
    activeBirds.forEach(b => b.el.remove());
    activeBirds = [];
    if (birdTimer) { clearTimeout(birdTimer); birdTimer = null; }

    if (animationId) cancelAnimationFrame(animationId);
    // ── Bug fix: immer clearen bevor neu setzen ──
    if (scoreTimer) { clearInterval(scoreTimer); scoreTimer = null; }
    if (cloudTimer) { clearInterval(cloudTimer); cloudTimer = null; }
  }

  // ─────────────────────────────────────────────
  //  Start
  // ─────────────────────────────────────────────
  async function startGame() {
    resetGame();
    await doCountdown();  // immer – nicht nur beim ersten Start

    startScreen.style.display = 'none';
    gameContainer.style.display = 'block';
    gameRunning = true;

    scoreTimer = setInterval(() => {
      if (!gameRunning) return;
      score++;
      scoreEl.textContent = score;
      updateCityLabel(score);

      const progress = Math.min(score / 100 * 100, 100);
      routeProgress.style.width = progress + '%';
      document.getElementById('routePlane').style.left = progress + '%';

      checkMilestones();
    }, 2000);

    cloudTimer = setInterval(() => {
      if (gameRunning) spawnObstacle();
    }, 5800);  // mehr Luft – war 4800

    spawnBirds();
    spawnBgClouds();
    startCabinNoise();  // Flugzeug-Kabinengeräusch
    gameLoop();
  }

  function restartGame() { resetGame(); startGame(); }
  function continueAfterWin() {
    winScreenEl.style.display = 'none';
    activateNightMode();
    gameRunning = true;

    // scoreTimer neu starten falls er durch den Overlay-Pause gestoppt war
    if (!scoreTimer) {
      scoreTimer = setInterval(() => {
        if (!gameRunning) return;
        score++;
        scoreEl.textContent = score;
        updateCityLabel(score);
        const progress = Math.min(score / 100 * 100, 100);
        routeProgress.style.width = progress + '%';
        checkMilestones();
      }, 2000);
    }

    gameLoop();
  }

  // ─────────────────────────────────────────────
  //  Sound (Web Audio API – kein externes File)
  // ─────────────────────────────────────────────
  let audioCtx = null;

  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration);
    } catch(e) {}
  }

  function soundLift() {
    playTone(480, 0.08, 'sine', 0.04);  // sehr subtil
  }

  function soundMilestone() {
    // Kleines fröhliches Arpeggio
    playTone(523, 0.15, 'sine', 0.12, 0.0);
    playTone(659, 0.15, 'sine', 0.12, 0.1);
    playTone(784, 0.25, 'sine', 0.14, 0.2);
  }

  function soundCrash() {
    // Rumble
    playTone(120, 0.4, 'sawtooth', 0.2, 0.0);
    playTone(80,  0.5, 'sawtooth', 0.15, 0.1);
  }

  function soundWin() {
    // Fanfare
    [523,659,784,1047].forEach((f, i) => playTone(f, 0.3, 'sine', 0.15, i * 0.12));
  }

  // Hintergrund-Rauschen (Flugzeug-Kabine)
  let noiseNode = null;
  let noiseGain = null;

  function startCabinNoise() {
    try {
      const ctx = getAudio();
      const bufferSize = ctx.sampleRate * 3;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      noiseNode = ctx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;

      // Tiefpass-Filter – macht's zu Kabinen-Rauschen
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;

      noiseGain = ctx.createGain();
      noiseGain.gain.value = 0;

      noiseNode.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noiseNode.start();

      // Sanft einfaden
      noiseGain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 3);
    } catch(e) {}
  }

  function stopCabinNoise() {
    try {
      if (noiseGain) {
        noiseGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
        setTimeout(() => { if (noiseNode) noiseNode.stop(); }, 2000);
        noiseNode = null; noiseGain = null;
      }
    } catch(e) {}
  }
  // ─────────────────────────────────────────────
  const mFar  = document.getElementById('mountains-far');
  const mMid  = document.getElementById('mountains-mid');
  const mNear = document.getElementById('mountains-near');
  let mountainX = 0;

  function animateMountains() {
    if (gameRunning) {
      mountainX -= 0.18; // sehr langsam – Ferngefühl
      const speed = Math.min(1.8 + score * 0.025, 3.2);
      const factor = speed / 1.8;
      mFar.style.transform  = `translateX(${mountainX * 0.3 * factor}px)`;
      mMid.style.transform  = `translateX(${mountainX * 0.55 * factor}px)`;
      mNear.style.transform = `translateX(${mountainX * 0.9 * factor}px)`;
      // Loop wenn zu weit links
      if (mountainX < -window.innerWidth) mountainX = 0;
    }
    requestAnimationFrame(animateMountains);
  }
  animateMountains();

  // Nacht-Farben für Berge
  const MOUNTAIN_COLORS = {
    day:   { far: '#a8c8e8', mid: '#90b4d0', near: '#7a9eb8' },
    night: { far: '#1a2a45', mid: '#142035', near: '#0d1828' },
  };

  function setMountainColors(mode) {
    const c = MOUNTAIN_COLORS[mode];
    document.getElementById('mf-path').style.fill = c.far;
    document.getElementById('mm-path').style.fill = c.mid;
    document.getElementById('mn-path').style.fill = c.near;
  }
  let nightActive = false;

  function activateNightMode() {
    if (nightActive) return;
    nightActive = true;
    document.body.classList.add('night');
    generateStars();
    setTimeout(() => setMountainColors('night'), 1000);
  }

  function deactivateNightMode() {
    nightActive = false;
    document.body.classList.remove('night');
    document.getElementById('starField').innerHTML = '';
    setMountainColors('day');
  }

  function generateStars() {
    const field = document.getElementById('starField');
    field.innerHTML = '';
    const count = 120;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2.5;
      s.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        top: ${Math.random() * 75}%;
        left: ${Math.random() * 100}%;
        animation-duration: ${2 + Math.random() * 4}s;
        animation-delay: ${Math.random() * 4}s;
        opacity: ${0.3 + Math.random() * 0.7};
      `;
      field.appendChild(s);
    }
  }

  // ─────────────────────────────────────────────
  //  Stadt-Label unter dem Score
  // ─────────────────────────────────────────────
  const CITIES = [
    { at: 0,  label: '🇨🇭 Zürich' },
    { at: 10, label: '🇮🇳 über Indien' },
    { at: 20, label: '🇹🇭 über Thailand' },
    { at: 30, label: '🇻🇳 über Vietnam' },
    { at: 40, label: '🇸🇬 fast Singapur!' },
    { at: 50, label: '🌙 über Japan' },
    { at: 60, label: '🌟 fast Incheon!' },
  ];

  function updateCityLabel(s) {
    let city = CITIES[0].label;
    for (const c of CITIES) { if (s >= c.at) city = c.label; }
    scoreEl.innerHTML = `${s}<br><span style="font-size:0.42em;font-weight:700;opacity:0.85;line-height:1.2">${city}</span>`;
  }

  // ─────────────────────────────────────────────
  //  Countdown
  // ─────────────────────────────────────────────
  async function doCountdown() {
    const overlay = document.getElementById('countdownOverlay');
    const text    = document.getElementById('countdownText');
    overlay.classList.add('visible');
    for (const step of ['3','2','1','Sanft abheben… ✈️']) {
      text.textContent = step;
      await pause(1200);
    }
    overlay.classList.remove('visible');
    await pause(400);
  }

  // ─────────────────────────────────────────────
  //  Game Loop
  // ─────────────────────────────────────────────
  function gameLoop() {
    if (!gameRunning) return;

    velocity += GRAVITY;
    velocity *= 0.978;
    velocity = Math.min(velocity, MAX_VEL);
    position += velocity;

    // Ceiling – bounce slightly downward so gravity takes over
    if (position < 6) { position = 6; velocity = 0.5; }
    // Floor = game over (nur wenn nicht unverwundbar)
    if (position > 86 && !invincible) { endGame(); return; }
    if (position > 86) position = 86; // einfrieren am Boden statt sterben

    plane.style.top = position + '%';
    plane.style.transform = `rotate(${Math.max(-22, Math.min(32, velocity * 5))}deg)`;

    moveObstacles();
    checkCollisions();  // ← war nicht aufgerufen = keine Kollision!

    animationId = requestAnimationFrame(gameLoop);
  }

  // ─────────────────────────────────────────────
  //  Milestones
  // ─────────────────────────────────────────────
  function checkMilestones() {
    for (const pts of [10, 20, 30, 40]) {
      if (score === pts && !triggered[pts]) {
        triggered[pts] = true;
        showSpruch(SPRUECHE[pts]);
        return;
      }
    }
    if (score >= 50 && !triggered[50]) {
      triggered[50] = true;
      showSingapurOverlay();
      return;
    }
    if (score >= 100 && !triggered[100]) {
      triggered[100] = true;
      showFinalScreen();
    }
  }

  function showSpruch({ emoji, text }) {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    soundMilestone();
    spruchEmoji.textContent = emoji;
    spruchText.textContent = text;
    document.getElementById('spruchCountdown').textContent = '';
    document.getElementById('spruchClose').style.display = 'block';
    spruchBubble.classList.add('show');
  }

  function closeSpruch() {
    spruchBubble.classList.remove('show');
    gameRunning = true;
    gameLoop();
  }

  async function showSingapurOverlay() {
    gameRunning = false;
    invincible = true;  // ab jetzt kein Crash mehr möglich
    cancelAnimationFrame(animationId);
    soundMilestone();

    // Flugzeug sanft zur Mitte gleiten lassen
    plane.style.transition = 'top 1.2s ease-out, transform 1.2s ease-out';
    plane.style.top = '45%';
    plane.style.transform = 'rotate(0deg)';
    await pause(1300);
    plane.style.transition = '';

    milestoneOverlay.classList.add('visible');
    await pause(3800);
    milestoneOverlay.classList.remove('visible');
    winScreenEl.style.display = 'grid';
  }

  // ─────────────────────────────────────────────
  //  Finaler ICN Endscreen
  // ─────────────────────────────────────────────

  // ⬇️ HIER deinen Spotify/Podcast Link eintragen:
  const SURPRISE_URL = 'https://open.spotify.com/playlist/DEIN-LINK-HIER';

  function showFinalScreen() {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    clearInterval(scoreTimer);
    clearInterval(cloudTimer);
    stopCabinNoise();
    soundWin();

    finalScreenEl.classList.add('show');
    spawnConfetti();
    drawQRCode(SURPRISE_URL);
  }

  function spawnConfetti() {
    const colors = ['#ffd54f','#66bb6a','#42a5f5','#ef5350','#ab47bc','#ff7043','#fff'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${6 + Math.random() * 10}px;
        height: ${8 + Math.random() * 14}px;
        animation-duration: ${2.5 + Math.random() * 3}s;
        animation-delay: ${Math.random() * 2}s;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      finalScreenEl.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
  }

  // Minimaler QR-Code Generator (kein externes Script nötig)
  function drawQRCode(url) {
    // Lädt qrcode.js dynamisch nach
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => {
      const canvas = document.getElementById('qrCanvas');
      canvas.style.display = 'none';
      const div = document.createElement('div');
      div.id = 'qrDiv';
      document.getElementById('qrBox').insertBefore(div, canvas);
      new QRCode(div, {
        text: url,
        width:  Math.min(210, window.innerWidth * 0.40),
        height: Math.min(210, window.innerWidth * 0.40),
        colorDark:  '#1a2a4a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H,
      });
    };
    document.head.appendChild(s);
  }

  // ─────────────────────────────────────────────
  //  Obstacles – Wolken & Häuser
  // ─────────────────────────────────────────────
  function spawnObstacle() {
    if (!gameRunning) return;
    // Nach Singapur (score > 50) nur noch Häuser – passt zum Nacht-Stadtbild
    if (score > 50) { createBuilding(); return; }
    // Vorher: 30% Häuser, 70% Wolken
    if (Math.random() < 0.30) createBuilding();
    else                       createCloudPair();
  }

  function createCloudPair() {
    const pair = document.createElement('div');
    pair.className = 'cloud-pair';
    pair.style.left = window.innerWidth + 'px';

    const minGap = 320;  // grosszügiger – war 280
    const maxGap = 420;  // war 380
    const gap  = minGap + Math.random() * (maxGap - minGap);
    const available = window.innerHeight - gap;
    const topH = 30 + Math.random() * (available - 60);
    const botH = Math.max(30, available - topH);

    const top = document.createElement('div');
    top.className = 'cloud top';
    top.style.height = topH + 'px';

    const bot = document.createElement('div');
    bot.className = 'cloud bottom';
    bot.style.height = botH + 'px';

    pair.append(top, bot);
    gameContainer.appendChild(pair);
    obstacles.push({ el: pair, x: window.innerWidth, w: 160 });
  }

  function createBuilding() {
    const wrap = document.createElement('div');
    wrap.className = 'building-wrap';
    wrap.style.left = window.innerWidth + 'px';

    const count  = 2 + Math.floor(Math.random() * 3);
    const maxBuildH = window.innerHeight - 220;

    let cursor = 0;
    let maxH = 0;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'building';
      const w = 32 + Math.floor(Math.random() * 26);
      const h = 80 + Math.floor(Math.random() * (maxBuildH - 80));
      b.style.width  = w + 'px';
      b.style.height = h + 'px';
      b.style.left   = cursor + 'px';
      cursor += w + 7;
      if (h > maxH) { maxH = h; b.classList.add('has-antenna'); }

      // Leuchtende Fenster als kleine Divs
      addWindows(b, w, h);

      wrap.appendChild(b);
    }
    wrap.style.width = cursor + 'px';

    gameContainer.appendChild(wrap);
    obstacles.push({ el: wrap, x: window.innerWidth, w: cursor });
  }

  function addWindows(building, bw, bh) {
    const winW = 6, winH = 7, gapX = 9, gapY = 11, marginX = 6, marginT = 10;
    const cols = Math.floor((bw - marginX * 2 + gapX) / (winW + gapX));
    const rows = Math.floor((bh - marginT)             / (winH + gapY));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.38) continue; // 38% dunkel
        const win = document.createElement('div');
        const warm = Math.random() < 0.75; // 75% warm gelb, rest kalt weiss-blau
        win.style.cssText = `
          position:absolute;
          width:${winW}px; height:${winH}px;
          left:${marginX + c * (winW + gapX)}px;
          top:${marginT + r * (winH + gapY)}px;
          background:${warm ? `rgba(255,${200+Math.floor(Math.random()*55)},60,0.85)` : 'rgba(180,220,255,0.75)'};
          border-radius:1px;
          box-shadow:0 0 4px ${warm ? 'rgba(255,180,0,0.6)' : 'rgba(150,200,255,0.5)'};
        `;
        building.appendChild(win);
      }
    }
  }

  function moveObstacles() {
    // Geschwindigkeit steigt mit Score: 1.5 → max 2.8 (war 1.8 → 3.2)
    const speed = Math.min(1.5 + score * 0.018, 2.8);
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= speed;
      obs.el.style.left = obs.x + 'px';
      if (obs.x < -(obs.w + 60)) {
        obs.el.remove();
        obstacles.splice(i, 1);
      }
    }
  }

  // ─────────────────────────────────────────────
  //  Collision – Wolken & Häuser + Near-Miss Wackeln
  // ─────────────────────────────────────────────
  let lastShake = 0;

  function checkCollisions() {
    const full = plane.getBoundingClientRect();
    const shrinkX = full.width  * 0.20;
    const shrinkY = full.height * 0.20;
    const p = {
      left:   full.left   + shrinkX,
      right:  full.right  - shrinkX,
      top:    full.top    + shrinkY,
      bottom: full.bottom - shrinkY,
    };
    // Near-miss zone: etwas grösser als Hitbox
    const nearMargin = 18;
    const near = {
      left:   p.left   - nearMargin,
      right:  p.right  + nearMargin,
      top:    p.top    - nearMargin,
      bottom: p.bottom + nearMargin,
    };

    for (const obs of obstacles) {
      for (const child of obs.el.children) {
        const c = child.getBoundingClientRect();
        if (c.width === 0 || c.height === 0) continue;

        // Echter Treffer – nur wenn nicht unverwundbar
        if (!invincible &&
            p.right > c.left && p.left < c.right &&
            p.bottom > c.top  && p.top  < c.bottom) {
          endGame();
          return;
        }

        // Near-miss: Wackeln + kurze Vibration
        const now = Date.now();
        if (now - lastShake > 600 &&
            near.right > c.left && near.left < c.right &&
            near.bottom > c.top && near.top  < c.bottom) {
          lastShake = now;
          plane.style.transition = 'transform 0.08s ease-out';
          plane.style.filter = 'brightness(1.6) drop-shadow(0 0 8px #ff0)';
          setTimeout(() => { plane.style.filter = ''; }, 350);
          if (navigator.vibrate) navigator.vibrate(40); // kurzes Rütteln
        }
      }
    }
  }

  // ─────────────────────────────────────────────
  //  End
  // ─────────────────────────────────────────────
  function endGame() {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    clearInterval(scoreTimer);
    clearInterval(cloudTimer);

    // Zufälliger frecher Text
    const msg = GAME_OVER_MSGS[Math.floor(Math.random() * GAME_OVER_MSGS.length)];
    document.getElementById('goTitle').textContent = msg.title;
    document.getElementById('goText').textContent  = msg.text;

    soundCrash();
    stopCabinNoise();
    // Flugzeug blinkt rot kurz + Vibration Crash-Pattern
    plane.style.filter = 'hue-rotate(180deg) brightness(1.4)';
    if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 160]);
    setTimeout(() => { plane.style.filter = ''; }, 600);

    gameOverEl.style.display = 'grid';
  }

  // ─────────────────────────────────────────────
  //  Input
  // ─────────────────────────────────────────────
  function applyLift() {
    if (!gameRunning) return;
    velocity += LIFT;
    velocity = Math.max(velocity, -MAX_VEL);
    soundLift();
    spawnHeart();
  }

  // Herz-Partikel beim Antippen
  const HEARTS = ['❤️','💙','✨','💫','🌟'];
  let lastHeartTime = 0;

  function spawnHeart() {
    const now = Date.now();
    if (now - lastHeartTime < 120) return; // max ~8/sec
    lastHeartTime = now;

    const planeRect = plane.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'heart-particle';
    el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    el.style.left = (planeRect.right - 10 + Math.random() * 20 - 10) + 'px';
    el.style.top  = (planeRect.top  + planeRect.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  document.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    applyLift();
    touchHeld = true;
  });
  document.addEventListener('pointerup',     () => touchHeld = false);
  document.addEventListener('pointerleave',  () => touchHeld = false);
  document.addEventListener('pointercancel', () => touchHeld = false);

  // Gentle hold-boost – stop near ceiling to prevent sticking
  setInterval(() => {
    if (touchHeld && gameRunning && position > 10) {
      velocity += -0.4;
      velocity = Math.max(velocity, -MAX_VEL);
    }
  }, 150);

  document.addEventListener('keydown', e => {
    if (!gameRunning) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      applyLift();
    }
  });

  // ─────────────────────────────────────────────
  //  Dekorative Hintergrundwolken
  // ─────────────────────────────────────────────
  function spawnBgClouds() {
    // Initiale Wolken verteilt über den Bildschirm
    for (let i = 0; i < 5; i++) {
      spawnOneBgCloud(Math.random() * 100); // startX in vw
    }
    // Kontinuierlich neue spawnen
    setInterval(() => {
      if (gameRunning) spawnOneBgCloud(110);
    }, 7000 + Math.random() * 4000);
  }

  function spawnOneBgCloud(startVw) {
    const el = document.createElement('div');
    el.className = 'bg-cloud';
    const size  = 80 + Math.random() * 180;
    const top   = 5 + Math.random() * 65;
    const dur   = 35 + Math.random() * 30;
    const op    = 0.3 + Math.random() * 0.35;
    el.style.cssText = `
      width: ${size}px;
      height: ${size * 0.55}px;
      top: ${top}%;
      left: ${startVw}vw;
      opacity: ${op};
      animation-duration: ${dur}s;
    `;
    document.body.appendChild(el);
    // Nach Animation entfernen
    setTimeout(() => el.remove(), dur * 1000 + 2000);
  }
  const BIRD_TYPES = ['🦅','🦢','🐦','🦜','🕊️'];
  let activeBirds  = [];
  let birdTimer    = null;

  function spawnBirds() {
    // kick off random spawner
    schedulNextBird();
    // animate every frame alongside game
    requestAnimationFrame(animateBirds);
  }

  function schedulNextBird() {
    // random gap: 4–12 seconds between birds
    const delay = 4000 + Math.random() * 8000;
    birdTimer = setTimeout(() => {
      if (gameRunning) spawnOneBird();
      schedulNextBird();
    }, delay);
  }

  function spawnOneBird() {
    const emoji    = BIRD_TYPES[Math.floor(Math.random() * BIRD_TYPES.length)];
    const size     = 1.0 + Math.random() * 1.0;          // 1.0–2.0rem
    const topPct   = 8 + Math.random() * 55;             // stay in sky area
    const speed    = 0.6 + Math.random() * 1.4;          // px per frame
    const opacity  = 0.35 + Math.random() * 0.45;

    const el = document.createElement('div');
    el.className   = 'bird';
    el.textContent = emoji;
    el.style.fontSize = size + 'rem';
    el.style.top      = topPct + '%';
    el.style.opacity  = opacity;
    el.style.left     = (window.innerWidth + 60) + 'px';

    gameContainer.appendChild(el);
    activeBirds.push({ el, x: window.innerWidth + 60, speed });
  }

  function animateBirds() {
    for (let i = activeBirds.length - 1; i >= 0; i--) {
      const b = activeBirds[i];
      b.x -= b.speed;
      b.el.style.left = b.x + 'px';
      if (b.x < -80) {
        b.el.remove();
        activeBirds.splice(i, 1);
      }
    }
    requestAnimationFrame(animateBirds);
  }

  // ─────────────────────────────────────────────
  //  Util
  // ─────────────────────────────────────────────
  function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Service Worker registrieren (PWA Offline-Support)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
